services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sigai-ws-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-ChangeMe_123!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sigai-ws-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sigai-ws-mailhog
    ports:
      - "1025:1025" # servidor SMTP de prueba (usar como SMTP_HOST en dev)
      - "8025:8025" # UI web para ver los correos enviados

volumes:
  sigai-ws-sqldata:
