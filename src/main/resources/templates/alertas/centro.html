<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/head :: head(titulo='Centro de Alertas')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb" th:text="#{nav.alertas}">Alertas</div>
        <div class="page-header">
            <h1 th:text="#{alertas.centro.h1}">Centro de Alertas</h1>
            <div class="page-actions">
                <form th:action="@{/alertas/verificar-cierre}" method="post" sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-secondary" th:text="#{alertas.verificarCierre}">Verificar cierre de cuatrimestre</button>
                </form>
                <a th:href="@{/alertas/historial}" class="btn btn-secondary" th:text="#{alertas.verHistorial}">Ver historial</a>
            </div>
        </div>

        <form method="get" th:action="@{/alertas}" class="filtros-bar" style="margin-bottom:16px">
            <div class="form-group" style="margin-bottom:0">
                <label th:text="#{alertas.colPrioridad}">Prioridad</label>
                <select name="prioridad">
                    <option value="" th:text="#{common.todos}">Todos</option>
                    <option value="CRITICA" th:selected="${prioridadSeleccionada != null and prioridadSeleccionada.name() == 'CRITICA'}" th:text="#{alertas.prioridad.critica}">Critica</option>
                    <option value="ALTA" th:selected="${prioridadSeleccionada != null and prioridadSeleccionada.name() == 'ALTA'}" th:text="#{alertas.prioridad.alta}">Alta</option>
                    <option value="MEDIA" th:selected="${prioridadSeleccionada != null and prioridadSeleccionada.name() == 'MEDIA'}" th:text="#{alertas.prioridad.media}">Media</option>
                    <option value="INFO" th:selected="${prioridadSeleccionada != null and prioridadSeleccionada.name() == 'INFO'}" th:text="#{alertas.prioridad.info}">Info</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;min-width:200px">
                <label th:text="#{dashboard.preceptor.colTipo}">Tipo</label>
                <select name="tipo">
                    <option value="" th:text="#{common.todos}">Todos</option>
                    <option th:each="t : ${tiposDisponibles}" th:value="${t}" th:selected="${t == tipoSeleccionado}" th:text="${t}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-secondary compacto" th:text="#{accion.filtrar}">Filtrar</button>
            <a th:href="@{/alertas}" class="btn btn-ghost compacto" th:if="${prioridadSeleccionada != null or (tipoSeleccionado != null and not #strings.isEmpty(tipoSeleccionado))}" th:text="#{accion.limpiarFiltros}">Limpiar</a>
        </form>

        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(alertas)}">
            <table class="tarjetas-en-tablet" data-mostrar-primeros="20" th:attr="data-texto-ver-todas=#{common.verTodas(${#lists.size(alertas)})}">
                <thead><tr><th th:text="#{alertas.colPrioridad}">Prioridad</th><th th:text="#{dashboard.preceptor.colTipo}">Tipo</th><th th:text="#{calificaciones.colAlumno}">Alumno</th><th th:text="#{alumnos.legajo.colDescripcion}">Descripcion</th><th th:text="#{alumnos.legajo.colFecha}">Fecha</th><th th:text="#{common.estado}">Estado</th><th th:text="#{common.acciones}">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="a : ${alertas}">
                    <td data-label="Prioridad">
                        <span class="chip chip-rojo" th:if="${a.prioridad.name() == 'CRITICA'}" th:text="#{alertas.prioridad.critica}">Critica</span>
                        <span class="chip chip-naranja" th:if="${a.prioridad.name() == 'ALTA'}" th:text="#{alertas.prioridad.alta}">Alta</span>
                        <span class="chip chip-gris" th:if="${a.prioridad.name() == 'MEDIA'}" th:text="#{alertas.prioridad.media}">Media</span>
                        <span class="chip chip-verde" th:if="${a.prioridad.name() == 'INFO'}" th:text="#{alertas.prioridad.info}">Info</span>
                    </td>
                    <td data-label="Tipo" th:text="${a.tipo}">-</td>
                    <td data-label="Alumno">
                        <a th:if="${a.alumno != null}" th:href="@{/alumnos/{id}(id=${a.alumno.id})}" th:text="${a.alumno.nombreCompleto}">-</a>
                    </td>
                    <td data-label="Descripcion" th:text="${a.descripcion}">-</td>
                    <td data-label="Fecha" th:text="${#temporals.format(a.generadaEn,'dd/MM/yyyy HH:mm')}">-</td>
                    <td data-label="Estado" th:text="${a.estado}">-</td>
                    <td data-label="Acciones">
                        <form th:action="@{/alertas/{id}/seguimiento(id=${a.id})}" method="post" style="display:inline" th:if="${a.estado.name() == 'NUEVA'}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-ghost compacto" th:text="#{alertas.enSeguimiento}">En seguimiento</button>
                        </form>
                        <form th:action="@{/alertas/{id}/resolver(id=${a.id})}" method="post" class="form-resolver-alerta">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="text" name="notaResolucion" th:placeholder="#{alertas.notaResolucionPlaceholder}" placeholder="Nota de resolucion"/>
                            <button type="submit" class="btn btn-success compacto" th:text="#{alertas.resolver}">Resolver</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(alertas)}">
            <div class="icono">&#9989;</div>
            <h3 th:text="#{alertas.vacioActivas}">No hay alertas activas</h3>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
