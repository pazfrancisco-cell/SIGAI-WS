<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Historial de Alertas')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/alertas}" th:text="#{nav.alertas}">Alertas</a> &gt; <span th:text="#{alertas.historialLabel}">Historial</span></div>
        <h1 th:text="#{alertas.historial.h1}">Historial de Alertas</h1>
        <div class="tabla-wrapper">
            <table class="tarjetas-en-tablet" data-mostrar-primeros="20" th:attr="data-texto-ver-todas=#{common.verTodas(${#lists.size(alertas)})}">
                <thead><tr><th th:text="#{alertas.colPrioridad}">Prioridad</th><th th:text="#{dashboard.preceptor.colTipo}">Tipo</th><th th:text="#{calificaciones.colAlumno}">Alumno</th><th th:text="#{alumnos.legajo.colDescripcion}">Descripcion</th><th th:text="#{alumnos.legajo.colFecha}">Fecha</th><th th:text="#{common.estado}">Estado</th><th th:text="#{alertas.colResolucion}">Resolucion</th></tr></thead>
                <tbody>
                <tr th:each="a : ${alertas}">
                    <td data-label="Prioridad" th:text="${a.prioridad}">-</td>
                    <td data-label="Tipo" th:text="${a.tipo}">-</td>
                    <td data-label="Alumno" th:text="${a.alumno != null ? a.alumno.nombreCompleto : '-'}">-</td>
                    <td data-label="Descripcion" th:text="${a.descripcion}">-</td>
                    <td data-label="Fecha" th:text="${#temporals.format(a.generadaEn,'dd/MM/yyyy HH:mm')}">-</td>
                    <td data-label="Estado" th:text="${a.estado}">-</td>
                    <td data-label="Resolucion" th:text="${a.notaResolucion ?: '-'}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
