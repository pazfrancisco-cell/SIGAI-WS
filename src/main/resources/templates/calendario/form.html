<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Evento del Calendario')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/calendario}" th:text="#{nav.calendario}">Calendario Academico</a> &gt; <span th:text="${eventoForm.id != null} ? #{accion.editar} : #{accion.nuevo}"></span></div>
        <h1 th:text="${eventoForm.id != null} ? #{calendario.tituloEditar} : #{calendario.tituloNuevo}">Evento</h1>
        <form th:action="${eventoForm.id != null} ? @{/calendario/{id}/editar(id=${eventoForm.id})} : @{/calendario}"
              th:object="${eventoForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label th:text="#{calificaciones.tituloRequerido}">Titulo*</label>
                <input type="text" th:field="*{titulo}" th:classappend="${#fields.hasErrors('titulo')} ? 'error'"/>
                <div class="error-mensaje" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
            </div>
            <div class="form-group">
                <label th:text="#{alumnos.legajo.colDescripcion}">Descripcion</label>
                <textarea th:field="*{descripcion}"></textarea>
            </div>
            <div class="form-group">
                <label th:text="#{alumnos.legajo.tipo}">Tipo*</label>
                <select th:field="*{tipo}" th:classappend="${#fields.hasErrors('tipo')} ? 'error'">
                    <option value="FERIADO" th:text="#{calendario.tipo.feriado}">Feriado</option>
                    <option value="EXAMEN" th:text="#{calendario.tipo.examen}">Examen</option>
                    <option value="ACTO" th:text="#{calendario.tipo.acto}">Acto</option>
                    <option value="REUNION" th:text="#{calendario.tipo.reunion}">Reunion</option>
                    <option value="OTRO" th:text="#{calendario.tipo.otro}">Otro</option>
                </select>
                <div class="error-mensaje" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label th:text="#{calificaciones.fechaRequerido}">Fecha de inicio*</label>
                    <input type="date" th:field="*{fechaInicio}" th:classappend="${#fields.hasErrors('fechaInicio')} ? 'error'"/>
                    <div class="error-mensaje" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
                </div>
                <div class="form-group">
                    <label th:text="#{calendario.fechaFin}">Fecha de fin (opcional)</label>
                    <input type="date" th:field="*{fechaFin}"/>
                </div>
            </div>
            <div class="form-group">
                <label th:text="#{calendario.alcance}">Alcance</label>
                <select th:field="*{cursoDivisionId}">
                    <option value="" th:text="#{calendario.institucional}">Institucional (toda la escuela)</option>
                    <option th:each="cd : ${cursosDivisiones}" th:value="${cd.id}" th:text="${cd.nombreCompleto}"></option>
                </select>
                <div class="texto-secundario" th:text="#{calendario.alcanceHint}">Dejar en "Institucional" para que lo vea toda la escuela, o elegir un curso/division puntual.</div>
            </div>
            <div class="page-actions">
                <a th:href="@{/calendario}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
