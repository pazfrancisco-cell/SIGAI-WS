<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Calendario Academico')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb" th:text="#{nav.calendario}">Calendario Academico</div>
        <div class="page-header">
            <h1 th:text="#{calendario.h1}">Calendario Academico</h1>
            <div class="page-actions" th:if="${puedeAdministrar}">
                <a th:href="@{/calendario/nuevo}" class="btn btn-primary" th:text="#{calendario.nuevoEvento}">+ Nuevo evento</a>
            </div>
        </div>

        <div class="card" style="margin-bottom:16px"
             th:with="mesAnterior=${mesSel == 1 ? 12 : mesSel - 1}, anioMesAnterior=${mesSel == 1 ? anioSel - 1 : anioSel},
                      mesSiguiente=${mesSel == 12 ? 1 : mesSel + 1}, anioMesSiguiente=${mesSel == 12 ? anioSel + 1 : anioSel}">
            <div class="page-header">
                <h3 th:text="${mesSel} + '/' + ${anioSel}"></h3>
                <div class="page-actions">
                    <a th:href="@{/calendario(anio=${anioMesAnterior},mes=${mesAnterior})}" class="btn btn-ghost compacto">&#8592; <span th:text="#{asistencia.mesAnterior}">Mes anterior</span></a>
                    <a th:href="@{/calendario(anio=${anioMesSiguiente},mes=${mesSiguiente})}" class="btn btn-ghost compacto"><span th:text="#{asistencia.mesSiguiente}">Mes siguiente</span> &#8594;</a>
                </div>
            </div>
            <table class="tabla-grilla calendario-mes" style="width:100%;text-align:center;border-collapse:collapse">
                <thead>
                <tr><th th:text="#{asistencia.dia.lun}">Lun</th><th th:text="#{asistencia.dia.mar}">Mar</th><th th:text="#{asistencia.dia.mie}">Mie</th><th th:text="#{asistencia.dia.jue}">Jue</th><th th:text="#{asistencia.dia.vie}">Vie</th><th th:text="#{asistencia.dia.sab}">Sab</th><th th:text="#{asistencia.dia.dom}">Dom</th></tr>
                </thead>
                <tbody>
                <tr th:each="semana : ${semanas}">
                    <td th:each="dia : ${semana}" style="padding:8px;border:1px solid #eee;vertical-align:top;min-width:60px">
                        <div th:if="${dia != 0}">
                            <div th:text="${dia}" class="texto-secundario" style="font-weight:600"></div>
                            <div th:each="ev : ${eventosPorDia.get(dia)}" th:title="${ev.titulo}" style="margin-top:2px">
                                <span class="chip"
                                      th:classappend="${ev.tipo.name() == 'FERIADO'} ? 'chip-rojo' :
                                                      (${ev.tipo.name() == 'EXAMEN'} ? 'chip-naranja' :
                                                      (${ev.tipo.name() == 'ACTO'} ? 'chip-verde' : 'chip-gris'))"
                                      style="display:block;font-size:11px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px"
                                      th:text="${ev.titulo}"></span>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="form-row" style="margin-top:8px;gap:16px">
                <span class="texto-secundario"><span class="chip chip-rojo" style="padding:2px 8px">&nbsp;</span> <span th:text="#{calendario.tipo.feriado}">Feriado</span></span>
                <span class="texto-secundario"><span class="chip chip-naranja" style="padding:2px 8px">&nbsp;</span> <span th:text="#{calendario.tipo.examen}">Examen</span></span>
                <span class="texto-secundario"><span class="chip chip-verde" style="padding:2px 8px">&nbsp;</span> <span th:text="#{calendario.tipo.acto}">Acto</span></span>
                <span class="texto-secundario"><span class="chip chip-gris" style="padding:2px 8px">&nbsp;</span> <span th:text="#{calendario.tipo.reunionUOtro}">Reunion / Otro</span></span>
            </div>
        </div>

        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(eventosDelMes)}">
            <table>
                <thead>
                <tr>
                    <th th:text="#{alumnos.legajo.colFecha}">Fecha</th>
                    <th th:text="#{calificaciones.colEvaluacion}">Titulo</th>
                    <th th:text="#{alumnos.legajo.tipo}">Tipo</th>
                    <th th:text="#{workshops.colCurso}">Curso</th>
                    <th th:if="${puedeAdministrar}" th:text="#{common.acciones}">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ev : ${eventosDelMes}">
                    <td data-label="Fecha">
                        <span th:text="${#temporals.format(ev.fechaInicio,'dd/MM/yyyy')}"></span>
                        <span th:if="${ev.fechaFin != null and !ev.fechaFin.equals(ev.fechaInicio)}"
                              th:text="' - ' + ${#temporals.format(ev.fechaFin,'dd/MM/yyyy')}"></span>
                    </td>
                    <td data-label="Titulo">
                        <div th:text="${ev.titulo}"></div>
                        <div class="texto-secundario" th:if="${ev.descripcion != null}" th:text="${ev.descripcion}"></div>
                    </td>
                    <td data-label="Tipo">
                        <span class="chip chip-rojo" th:if="${ev.tipo.name() == 'FERIADO'}" th:text="#{calendario.tipo.feriado}">Feriado</span>
                        <span class="chip chip-naranja" th:if="${ev.tipo.name() == 'EXAMEN'}" th:text="#{calendario.tipo.examen}">Examen</span>
                        <span class="chip chip-verde" th:if="${ev.tipo.name() == 'ACTO'}" th:text="#{calendario.tipo.acto}">Acto</span>
                        <span class="chip chip-gris" th:if="${ev.tipo.name() == 'REUNION'}" th:text="#{calendario.tipo.reunion}">Reunion</span>
                        <span class="chip chip-gris" th:if="${ev.tipo.name() == 'OTRO'}" th:text="#{calendario.tipo.otro}">Otro</span>
                    </td>
                    <td data-label="Curso">
                        <span th:if="${ev.cursoDivision == null}" th:text="#{calendario.institucional}">Institucional</span>
                        <span th:if="${ev.cursoDivision != null}" th:text="${ev.cursoDivision.nombreCompleto}"></span>
                    </td>
                    <td data-label="Acciones" th:if="${puedeAdministrar}">
                        <a th:href="@{/calendario/{id}/editar(id=${ev.id})}" class="btn-icon" th:title="#{accion.editar}">&#9998;</a>
                        <form th:action="@{/calendario/{id}/eliminar(id=${ev.id})}" method="post" style="display:inline"
                              th:attr="data-confirm=#{calendario.confirmEliminar}" data-confirm="¿Eliminar este evento?">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn-icon" style="color:var(--rojo-critico)" th:title="#{accion.eliminar}">&#128465;</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(eventosDelMes)}">
            <h3 th:text="#{calendario.vacio}">No hay eventos cargados para este mes</h3>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
