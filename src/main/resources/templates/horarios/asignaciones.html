<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Asignacion Docente')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><a th:href="@{/horarios}" th:text="#{nav.horarios}">Horarios</a> &gt; <span th:text="#{horarios.asignacionDocente}">Asignacion Docente</span></div>
        <h1 th:text="#{horarios.asignacionDocente}">Asignacion Docente</h1>

        <div class="card">
            <h3 th:text="#{horarios.nuevaAsignacion}">Nueva asignacion</h3>
            <form th:action="@{/horarios/asignaciones}" th:object="${asignacionDocenteForm}" method="post" class="form-row" style="align-items:flex-end">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label for="docenteBusqueda" th:text="#{horarios.docenteRequerido}">Docente*</label>
                    <input type="text" id="docenteBusqueda" list="docentes-datalist" data-busqueda-id="docenteId"
                           autocomplete="off" th:placeholder="#{horarios.docenteBuscarPlaceholder}" placeholder="Escribi para buscar..."/>
                    <input type="hidden" id="docenteId" name="docenteId"/>
                    <datalist id="docentes-datalist">
                        <option th:each="d : ${docentes}" th:value="${d.nombreCompleto}" th:attr="data-id=${d.id}"></option>
                    </datalist>
                </div>
                <div class="form-group">
                    <label th:text="#{horarios.materiaRequerido}">Materia*</label>
                    <select th:field="*{materiaId}">
                        <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label th:text="#{horarios.cursoDivisionRequerido}">Curso/Division*</label>
                    <select th:field="*{cursoDivisionId}">
                        <option th:each="cd : ${cursosDivisiones}" th:value="${cd.id}" th:text="${cd.nombreCompleto}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary compacto" th:text="#{horarios.asignar}">Asignar</button>
            </form>
        </div>

        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(asignaciones)}">
            <table>
                <thead><tr><th th:text="#{horarios.docente}">Docente</th><th th:text="#{common.materia}">Materia</th><th th:text="#{common.cursoDivision}">Curso/Division</th><th th:text="#{common.acciones}">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="a : ${asignaciones}">
                    <td data-label="Docente" th:text="${a.docente.nombreCompleto}">-</td>
                    <td data-label="Materia" th:text="${a.materia.nombre}">-</td>
                    <td data-label="Curso/Division" th:text="${a.cursoDivision.nombreCompleto}">-</td>
                    <td data-label="Acciones">
                        <form th:action="@{/horarios/asignaciones/{id}/eliminar(id=${a.id})}" method="post" th:attr="data-confirm=#{horarios.confirmEliminarAsignacion}" data-confirm="¿Eliminar esta asignacion?">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger compacto" th:text="#{accion.eliminar}">Eliminar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(asignaciones)}"><h3 th:text="#{horarios.vacioAsignaciones}">No hay asignaciones para el ciclo lectivo activo</h3></div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
