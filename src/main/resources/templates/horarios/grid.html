<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/head :: head(titulo='Horarios')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb" th:text="#{nav.horarios}">Horarios</div>
        <div class="page-header">
            <h1 th:text="#{horarios.grid.h1}">Gestion de Horarios</h1>
            <div class="page-actions">
                <a th:href="@{/horarios/vista-global}" class="btn btn-secondary" th:text="#{horarios.vistaGlobal}">Vista Global</a>
                <a th:href="@{/horarios/asignaciones}" class="btn btn-secondary" sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')" th:text="#{horarios.asignacionesDocente}">Asignaciones Docente</a>
            </div>
        </div>

        <form method="get" th:action="@{/horarios}" class="filtros-bar">
            <div class="form-group">
                <label th:text="#{horarios.division}">Division</label>
                <select name="cursoDivisionId" onchange="this.form.submit()">
                    <option th:each="cd : ${cursosDivisiones}" th:value="${cd.id}" th:text="${cd.nombreCompleto}"
                            th:selected="${cd.id == divisionSeleccionada}"></option>
                </select>
            </div>
        </form>

        <div class="tabla-wrapper" th:if="${divisionSeleccionada != null}">
            <table class="tabla-grilla con-columna-fija horario-semanal">
                <thead>
                <tr>
                    <th th:text="#{horarios.colPeriodo}">Periodo</th>
                    <th th:text="#{horarios.dia.lunes}">Lunes</th><th th:text="#{horarios.dia.martes}">Martes</th><th th:text="#{horarios.dia.miercoles}">Miercoles</th><th th:text="#{horarios.dia.jueves}">Jueves</th><th th:text="#{horarios.dia.viernes}">Viernes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="periodo : ${periodos}">
                    <td data-label="Periodo">
                        <b th:text="${periodo.nombre}">Periodo 1</b><br/>
                        <span class="texto-secundario" th:text="${#temporals.format(periodo.horaInicio,'HH:mm')} + ' - ' + ${#temporals.format(periodo.horaFin,'HH:mm')}"></span>
                    </td>
                    <td data-label="Dia" th:each="dia : ${#numbers.sequence(1,5)}"
                        th:with="slot=${slotsPorClave.get(dia + '-' + periodo.orden)}">
                        <div th:if="${slot != null and slot.materia != null}" style="margin-bottom:6px">
                            <span class="chip chip-verde" th:text="${slot.materia.nombre}"></span><br/>
                            <span class="texto-secundario" th:text="${slot.docente != null ? slot.docente.nombreCompleto : ''}"></span>
                            <span class="texto-secundario" th:if="${slot.aula != null}" th:text="${' - ' + slot.aula.nombre}"></span>
                        </div>
                        <button type="button" class="btn btn-ghost compacto" style="font-size:12px;height:28px;width:100%"
                                sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')"
                                th:text="${slot != null and slot.materia != null} ? #{accion.editar} : #{horarios.masAsignar}"
                                th:attr="data-editar-slot-dia=${dia},data-editar-slot-periodo=${periodo.orden},
                                         data-editar-slot-materia=${slot != null and slot.materia != null ? slot.materia.id : ''},
                                         data-editar-slot-docente=${slot != null and slot.docente != null ? slot.docente.id : ''},
                                         data-editar-slot-aula=${slot != null and slot.aula != null ? slot.aula.id : ''}"></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${divisionSeleccionada == null}">
            <h3 th:text="#{horarios.vacioCursos}">No hay cursos/divisiones configurados</h3>
        </div>

        <div class="modal-overlay" id="modal-editar-slot" style="display:none" sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')">
            <div class="modal-card">
                <h3 th:text="#{horarios.asignarHorario}">Asignar horario</h3>
                <p class="texto-secundario" id="editar-slot-descripcion"></p>
                <form th:action="@{/horarios/slot}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="cursoDivisionId" th:value="${divisionSeleccionada}"/>
                    <input type="hidden" name="diaSemana" id="editar-slot-dia"/>
                    <input type="hidden" name="periodoOrden" id="editar-slot-periodo"/>
                    <div class="form-group">
                        <label th:text="#{common.materia}">Materia</label>
                        <select name="materiaId" id="editar-slot-materia">
                            <option value="" th:text="#{horarios.sinAsignar}">— Sin asignar —</option>
                            <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{horarios.docente}">Docente</label>
                        <select name="docenteId" id="editar-slot-docente">
                            <option value="" th:text="#{horarios.sinAsignar}">— Sin asignar —</option>
                            <option th:each="d : ${docentes}" th:value="${d.id}" th:text="${d.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{dashboard.docente.colAula}">Aula</label>
                        <select name="aulaId" id="editar-slot-aula">
                            <option value="" th:text="#{horarios.sinAsignar}">— Sin asignar —</option>
                            <option th:each="a : ${aulas}" th:value="${a.id}" th:text="${a.nombre}"></option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="btn-cancelar-editar-slot" th:text="#{accion.cancelar}">Cancelar</button>
                        <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
