<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Alumno')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/alumnos}" th:text="#{nav.alumnos}">Alumnos</a> &gt; <span th:text="${alumnoForm.id != null} ? #{accion.editar} : #{accion.nuevo}"></span></div>
        <h1 th:text="${alumnoForm.id != null} ? #{alumnos.form.tituloEditar} : #{alumnos.form.tituloNuevo}">Alumno</h1>

        <form th:action="${alumnoForm.id != null} ? @{/alumnos/{id}(id=${alumnoForm.id})} : @{/alumnos}"
              th:object="${alumnoForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>

            <fieldset>
                <legend th:text="#{alumnos.form.seccionPersonales}">1. Datos Personales</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{alumnos.form.apellido}">Apellido*</label>
                        <input type="text" th:field="*{apellido}" th:classappend="${#fields.hasErrors('apellido')} ? 'error'"/>
                        <div class="error-mensaje" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.nombre}">Nombre*</label>
                        <input type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'error'"/>
                        <div class="error-mensaje" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.dni}">DNI*</label>
                        <input type="text" th:field="*{dni}" maxlength="8" th:classappend="${#fields.hasErrors('dni')} ? 'error'"/>
                        <div class="error-mensaje" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{alumnos.form.fechaNacimiento}">Fecha de Nacimiento*</label>
                        <input type="date" th:field="*{fechaNacimiento}" th:max="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}" th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'error'"/>
                        <div class="error-mensaje" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.genero}">Genero</label>
                        <select th:field="*{genero}">
                            <option value="">-</option>
                            <option value="MASCULINO" th:text="#{alumnos.form.generoMasculino}">Masculino</option>
                            <option value="FEMENINO" th:text="#{alumnos.form.generoFemenino}">Femenino</option>
                            <option value="OTRO" th:text="#{common.otro}">Otro</option>
                            <option value="PREFIERO_NO_DECIR" th:text="#{alumnos.form.generoPrefiero}">Prefiero no decir</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.nacionalidad}">Nacionalidad*</label>
                        <input type="text" th:field="*{nacionalidad}"/>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{alumnos.form.domicilio}">Domicilio*</label>
                        <input type="text" th:field="*{domicilio}" th:classappend="${#fields.hasErrors('domicilio')} ? 'error'"/>
                        <div class="error-mensaje" th:if="${#fields.hasErrors('domicilio')}" th:errors="*{domicilio}"></div>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.localidad}">Localidad*</label>
                        <input type="text" th:field="*{localidad}" th:classappend="${#fields.hasErrors('localidad')} ? 'error'"/>
                        <div class="error-mensaje" th:if="${#fields.hasErrors('localidad')}" th:errors="*{localidad}"></div>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend th:text="#{alumnos.form.seccionAcademicos}">2. Datos Academicos</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{alumnos.form.anioCurso}">Año/Curso*</label>
                        <select th:field="*{anio}" th:classappend="${#fields.hasErrors('anio')} ? 'error'">
                            <option th:each="n : ${#numbers.sequence(1,6)}" th:value="${n}" th:text="${n + '°'}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.division}">Division*</label>
                        <select th:field="*{division}">
                            <option th:each="d : ${divisionesDisponibles}" th:value="${d}" th:text="${d}">A</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.estado}">Estado*</label>
                        <select th:field="*{estado}">
                            <option value="ACTIVO" th:text="#{estado.activo}">Activo</option>
                            <option value="INACTIVO_BAJA" th:text="#{estado.inactivo}">Inactivo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.cicloIngreso}">Ciclo Lectivo de Ingreso*</label>
                        <select th:field="*{cicloLectivoIngresoId}">
                            <option th:each="cl : ${cicloLectivos}" th:value="${cl.id}" th:text="${cl.anio}"></option>
                        </select>
                    </div>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="repetidor" th:field="*{repetidor}"/>
                    <label for="repetidor" style="margin:0" th:text="#{alumnos.form.repetidor}">¿Alumno repetidor?</label>
                </div>
            </fieldset>

            <fieldset>
                <legend th:text="#{alumnos.form.seccionTutores}">3. Tutores / Responsables</legend>
                <div id="tutores-contenedor">
                    <div class="tutor-fieldset card" th:each="tutor, iter : *{tutores}">
                        <div class="form-row">
                            <div class="form-group">
                                <label th:text="#{alumnos.form.tutorApellidoNombre}">Apellido y Nombre*</label>
                                <input type="text" th:field="*{tutores[__${iter.index}__].apellido}" th:placeholder="#{alumnos.form.apellidoPh}" placeholder="Apellido"/>
                                <input type="text" th:field="*{tutores[__${iter.index}__].nombre}" th:placeholder="#{alumnos.form.nombrePh}" placeholder="Nombre" style="margin-top:6px"/>
                            </div>
                            <div class="form-group">
                                <label th:text="#{alumnos.form.tutorVinculo}">Vinculo*</label>
                                <select th:field="*{tutores[__${iter.index}__].vinculo}">
                                    <option value="PADRE" th:text="#{alumnos.form.vinculoPadre}">Padre</option>
                                    <option value="MADRE" th:text="#{alumnos.form.vinculoMadre}">Madre</option>
                                    <option value="TUTOR_LEGAL" th:text="#{alumnos.form.vinculoTutorLegal}">Tutor legal</option>
                                    <option value="OTRO" th:text="#{common.otro}">Otro</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label th:text="#{alumnos.form.dni}">DNI*</label>
                                <input type="text" th:field="*{tutores[__${iter.index}__].dni}"/>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label th:text="#{alumnos.form.tutorTelefono}">Telefono*</label>
                                <input type="text" th:field="*{tutores[__${iter.index}__].telefono}"/>
                            </div>
                            <div class="form-group">
                                <label th:text="#{alumnos.form.tutorEmail}">Email*</label>
                                <input type="email" th:field="*{tutores[__${iter.index}__].email}"/>
                            </div>
                            <div class="form-group" style="display:flex;align-items:flex-end;gap:8px">
                                <div class="checkbox-row">
                                    <input type="checkbox" th:field="*{tutores[__${iter.index}__].recibeNotificaciones}"/>
                                    <label style="margin:0" th:text="#{alumnos.form.tutorRecibeNotif}">Recibe notificaciones</label>
                                </div>
                                <button type="button" class="btn btn-ghost compacto" data-quitar-tutor="true" th:text="#{alumnos.form.tutorQuitar}">Quitar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" id="btn-agregar-tutor" class="btn btn-secondary compacto" th:text="#{alumnos.form.agregarTutor}">+ Agregar tutor</button>
                <div class="texto-secundario" style="margin-top:6px" th:text="#{alumnos.form.tutorHint}">Maximo 2 tutores por alumno. Si el DNI ya existe en el sistema, se vincula sin duplicar.</div>
            </fieldset>

            <div class="page-actions" style="margin-top:20px">
                <a th:href="@{/alumnos}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>

        <!-- Plantilla usada por app.js para agregar un nuevo tutor dinamicamente -->
        <template id="tutor-template">
            <div class="tutor-fieldset card">
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{alumnos.form.tutorApellidoNombre}">Apellido y Nombre*</label>
                        <input type="text" name="tutores[__INDEX__].apellido" th:placeholder="#{alumnos.form.apellidoPh}" placeholder="Apellido"/>
                        <input type="text" name="tutores[__INDEX__].nombre" th:placeholder="#{alumnos.form.nombrePh}" placeholder="Nombre" style="margin-top:6px"/>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.form.tutorVinculo}">Vinculo*</label>
                        <select name="tutores[__INDEX__].vinculo">
                            <option value="PADRE" th:text="#{alumnos.form.vinculoPadre}">Padre</option>
                            <option value="MADRE" th:text="#{alumnos.form.vinculoMadre}">Madre</option>
                            <option value="TUTOR_LEGAL" th:text="#{alumnos.form.vinculoTutorLegal}">Tutor legal</option>
                            <option value="OTRO" th:text="#{common.otro}">Otro</option>
                        </select>
                    </div>
                    <div class="form-group"><label th:text="#{alumnos.form.dni}">DNI*</label><input type="text" name="tutores[__INDEX__].dni"/></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label th:text="#{alumnos.form.tutorTelefono}">Telefono*</label><input type="text" name="tutores[__INDEX__].telefono"/></div>
                    <div class="form-group"><label th:text="#{alumnos.form.tutorEmail}">Email*</label><input type="email" name="tutores[__INDEX__].email"/></div>
                    <div class="form-group" style="display:flex;align-items:flex-end;gap:8px">
                        <div class="checkbox-row">
                            <input type="checkbox" name="tutores[__INDEX__].recibeNotificaciones" checked="checked"/>
                            <label style="margin:0" th:text="#{alumnos.form.tutorRecibeNotif}">Recibe notificaciones</label>
                        </div>
                        <button type="button" class="btn btn-ghost compacto" data-quitar-tutor="true" th:text="#{alumnos.form.tutorQuitar}">Quitar</button>
                    </div>
                </div>
            </div>
        </template>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
