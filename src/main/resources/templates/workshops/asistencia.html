<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Asistencia - Workshop')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.workshops}">Workshops</span> &gt; <span th:text="#{nav.asistencia}">Asistencia</span></div>
        <h1 th:text="#{workshops.asistencia.h1}">Asistencia de Workshop</h1>
        <p class="texto-secundario" th:text="${#temporals.format(fecha,'dd/MM/yyyy')}">Fecha</p>

        <form method="get" th:action="@{/workshops/asistencia}" class="filtros-bar">
            <div class="form-group">
                <label th:text="#{nav.workshops}">Workshop</label>
                <select name="workshopId" onchange="this.form.submit()">
                    <option value="">-</option>
                    <option th:each="w : ${workshops}" th:value="${w.id}" th:text="${w.nombre}"
                            th:selected="${w.id == workshopSeleccionado}"></option>
                </select>
            </div>
            <div class="form-group">
                <label th:text="#{alumnos.legajo.cuatrimestre}">Cuatrimestre</label>
                <select name="cuatrimestre" onchange="this.form.submit()">
                    <option value="1" th:selected="${cuatrimestre == 1}" th:text="#{calificaciones.cuatrimestre1}">1° Cuatrimestre</option>
                    <option value="2" th:selected="${cuatrimestre == 2}" th:text="#{calificaciones.cuatrimestre2}">2° Cuatrimestre</option>
                </select>
            </div>
        </form>

        <form th:action="@{/workshops/asistencia}" method="post" th:if="${alumnos != null}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="workshopId" th:value="${workshopSeleccionado}"/>
            <input type="hidden" name="cuatrimestre" th:value="${cuatrimestre}"/>
            <input type="hidden" name="fecha" th:value="${#temporals.format(fecha,'yyyy-MM-dd')}"/>

            <div class="tabla-wrapper">
                <table class="tabla-asistencia">
                    <thead><tr><th>#</th><th th:text="#{alumnos.colApellidoNombre}">Apellido y Nombre</th><th th:text="#{common.estado}">Estado</th><th th:text="#{asistencia.colObservacion}">Observacion</th></tr></thead>
                    <tbody>
                    <tr th:each="alumno, iter : ${alumnos}">
                        <td data-label="#" th:text="${iter.count}">1</td>
                        <td data-label="Alumno" th:text="${alumno.nombreCompleto}">-</td>
                        <td data-label="Estado">
                            <input type="hidden" th:name="|items[${iter.index}].alumnoId|" th:value="${alumno.id}"/>
                            <select th:name="|items[${iter.index}].tipo|">
                                <option value="PRESENTE" selected="selected" th:text="#{asistencia.tipo.presente}">Presente</option>
                                <option value="AUSENTE" th:text="#{asistencia.tipo.ausente}">Ausente</option>
                                <option value="LLEGADA_TARDE" th:text="#{asistencia.tipo.llegadaTarde}">1/4 Llegada Tarde</option>
                            </select>
                        </td>
                        <td data-label="Observacion">
                            <input type="text" th:name="|items[${iter.index}].observacion|" style="height:30px"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:12px" th:text="#{asistencia.guardar}">Guardar Asistencia</button>
        </form>

        <div class="estado-vacio" th:if="${alumnos == null}">
            <h3 th:text="#{workshops.seleccioneWorkshop}">Seleccione un workshop</h3>
        </div>
        <div class="estado-vacio" th:if="${alumnos != null and #lists.isEmpty(alumnos)}">
            <h3 th:text="#{workshops.sinAlumnosCuatrimestre}">Ningun alumno eligio este workshop en este cuatrimestre</h3>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
