<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Comunicado')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><a th:href="@{/mensajes/comunicado}" th:text="#{comunicados.breadcrumb}">Comunicados</a> &gt; <span th:text="${comunicado.asunto}">Detalle</span></div>

        <div class="card">
            <div class="page-header">
                <h1 th:text="${comunicado.asunto}">Asunto</h1>
                <span class="texto-secundario" th:text="${#temporals.format(comunicado.creadoEn,'dd/MM/yyyy HH:mm')}">Fecha</span>
            </div>
            <p class="texto-secundario"><span th:text="#{comunicados.enviadoPor}">Enviado por</span> <strong th:text="${comunicado.autor.nombreCompleto}">Autor</strong></p>
            <p th:text="${comunicado.contenido}" style="white-space:pre-wrap">Contenido</p>
            <a th:if="${comunicado.adjuntoPath != null}" th:href="'/archivos?' + ${@firmaArchivoService.queryFirmado(comunicado.adjuntoPath)}"
               target="_blank" class="btn btn-secondary compacto" th:text="#{comunicados.descargarAdjunto}">Descargar adjunto</a>
        </div>

        <div class="form-row">
            <div class="card" style="flex:1;min-width:260px">
                <h3><span th:text="#{comunicados.leido}">Leido</span> (<span th:text="${resumen.leidos()}">0</span> <span th:text="#{common.de}">de</span> <span th:text="${resumen.audiencia()}">0</span>)</h3>
                <div class="tabla-wrapper" th:if="${not #lists.isEmpty(lecturas)}">
                    <table>
                        <thead><tr><th th:text="#{comunicados.padreTutor}">Padre/Tutor</th><th th:text="#{comunicados.fechaHoraLectura}">Fecha y hora de lectura</th></tr></thead>
                        <tbody>
                        <tr th:each="l : ${lecturas}">
                            <td data-label="Padre/Tutor" th:text="${l.usuario.nombreCompleto}">-</td>
                            <td data-label="Fecha y hora de lectura" th:text="${#temporals.format(l.leidoEn,'dd/MM/yyyy HH:mm')}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="estado-vacio" th:if="${#lists.isEmpty(lecturas)}"><h3 th:text="#{comunicados.nadieLeyo}">Todavia nadie lo leyo</h3></div>
            </div>
            <div class="card" style="flex:1;min-width:260px">
                <h3 th:text="#{comunicados.pendientesDeLeer}">Pendientes de leer</h3>
                <div class="tabla-wrapper" th:if="${not #lists.isEmpty(pendientes)}">
                    <table>
                        <thead><tr><th th:text="#{comunicados.padreTutor}">Padre/Tutor</th><th th:text="#{comunicados.emailCol}">Email</th></tr></thead>
                        <tbody>
                        <tr th:each="u : ${pendientes}">
                            <td data-label="Padre/Tutor" th:text="${u.nombreCompleto}">-</td>
                            <td data-label="Email" th:text="${u.email}">-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="estado-vacio" th:if="${#lists.isEmpty(pendientes)}"><h3 th:text="#{comunicados.todosLeyeron}">Todos los destinatarios ya lo leyeron</h3></div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
