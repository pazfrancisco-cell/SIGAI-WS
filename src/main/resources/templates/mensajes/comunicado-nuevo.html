<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Nuevo Comunicado')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/mensajes/comunicado}" th:text="#{comunicados.breadcrumb}">Comunicados</a> &gt; <span th:text="#{accion.nuevo}">Nuevo</span></div>
        <h1 th:text="#{comunicados.nuevoH1}">Nuevo Comunicado Institucional</h1>

        <form th:action="@{/mensajes/comunicado}" th:object="${comunicadoForm}" method="post" enctype="multipart/form-data" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label th:text="#{comunicados.destinatariosRequerido}">Destinatarios* (seleccion multiple)</label>
                <div class="checkbox-row">
                    <input type="checkbox" id="destTodosPadres" name="tiposDestinatario" value="TODOS_PADRES"/>
                    <label for="destTodosPadres" style="margin:0" th:text="#{comunicados.todosPadres}">Todos los padres</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="destTodosDocentes" name="tiposDestinatario" value="TODOS_DOCENTES"/>
                    <label for="destTodosDocentes" style="margin:0" th:text="#{comunicados.todosDocentes}">Todos los docentes</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="destCurso" name="tiposDestinatario" value="CURSO"
                           onchange="document.getElementById('grupoCurso').style.display = this.checked?'block':'none';"/>
                    <label for="destCurso" style="margin:0" th:text="#{comunicados.cursoEspecifico}">Curso especifico</label>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="destAlumno" name="tiposDestinatario" value="ALUMNO"
                           onchange="document.getElementById('grupoAlumno').style.display = this.checked?'block':'none';"/>
                    <label for="destAlumno" style="margin:0" th:text="#{comunicados.alumnoEspecifico}">Alumno especifico</label>
                </div>
                <div class="error-mensaje" th:if="${#fields.hasErrors('tiposDestinatario')}" th:errors="*{tiposDestinatario}"></div>
            </div>
            <div class="form-group" id="grupoCurso" style="display:none">
                <label th:text="#{common.cursoDivision}">Curso/Division</label>
                <select th:field="*{cursoDivisionId}">
                    <option th:each="cd : ${cursosDivisiones}" th:value="${cd.id}" th:text="${cd.nombreCompleto}"></option>
                </select>
            </div>
            <div class="form-group" id="grupoAlumno" style="display:none">
                <label th:text="#{comunicados.alumnoLabel}">Alumno</label>
                <select th:field="*{alumnoId}">
                    <option th:each="a : ${alumnos}" th:value="${a.id}" th:text="${a.nombreCompleto}"></option>
                </select>
            </div>
            <div class="form-group">
                <label th:text="#{comunicados.asuntoRequerido}">Asunto*</label>
                <input type="text" th:field="*{asunto}" maxlength="120"/>
            </div>
            <div class="form-group">
                <label th:text="#{comunicados.contenidoRequerido}">Contenido*</label>
                <textarea th:field="*{contenido}"></textarea>
            </div>
            <div class="form-group">
                <label th:text="#{comunicados.adjuntoLabel}">Adjunto (opcional, max 5MB)</label>
                <input type="file" th:field="*{adjunto}"/>
            </div>
            <div class="checkbox-row">
                <input type="checkbox" id="enviarEmail" th:field="*{enviarEmail}"/>
                <label for="enviarEmail" style="margin:0" th:text="#{comunicados.enviarEmailLabel}">Enviar notificacion por email a los destinatarios</label>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:12px" th:text="#{comunicados.enviarComunicado}">Enviar Comunicado</button>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
