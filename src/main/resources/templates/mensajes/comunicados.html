<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Comunicados Institucionales')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><a th:href="@{/mensajes}" th:text="#{nav.mensajes}">Mensajes</a> &gt; <span th:text="#{comunicados.breadcrumb}">Comunicados</span></div>
        <div class="page-header">
            <h1 th:text="#{comunicados.institucionales}">Comunicados Institucionales</h1>
            <div class="page-actions"><a th:href="@{/mensajes/comunicado/nuevo}" class="btn btn-primary" th:text="#{dashboard.directivo.nuevoComunicado}">+ Nuevo Comunicado</a></div>
        </div>

        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(comunicados)}">
            <table>
                <thead><tr><th th:text="#{comunicados.colAsunto}">Asunto</th><th th:text="#{comunicados.colAutor}">Autor</th><th th:text="#{alumnos.legajo.colFecha}">Fecha</th><th th:text="#{comunicados.colLeidoPorPadres}">Leido por (padres)</th><th th:text="#{comunicados.colAdjunto}">Adjunto</th><th th:text="#{common.acciones}">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="c : ${comunicados}" th:with="resumen=${resumenes.get(c.id)}">
                    <td data-label="Asunto" th:text="${c.asunto}">-</td>
                    <td data-label="Autor" th:text="${c.autor.nombreCompleto}">-</td>
                    <td data-label="Fecha" th:text="${#temporals.format(c.creadoEn,'dd/MM/yyyy HH:mm')}">-</td>
                    <td data-label="Leido por (padres)">
                        <span class="chip" th:classappend="${resumen.audiencia() > 0 and resumen.leidos() == resumen.audiencia()} ? 'chip-verde' : 'chip-gris'"
                              th:text="${resumen.leidos()} + ' / ' + ${resumen.audiencia()}">0 / 0</span>
                    </td>
                    <td data-label="Adjunto">
                        <a th:if="${c.adjuntoPath != null}" th:href="'/archivos?' + ${@firmaArchivoService.queryFirmado(c.adjuntoPath)}" target="_blank" th:text="#{comunicados.descargar}">Descargar</a>
                    </td>
                    <td data-label="Acciones">
                        <a th:href="@{/mensajes/comunicado/{id}(id=${c.id})}" class="btn btn-secondary compacto" th:text="#{comunicados.verDetalle}">Ver detalle</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(comunicados)}"><h3 th:text="#{comunicados.vacio}">No se enviaron comunicados todavia</h3></div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
