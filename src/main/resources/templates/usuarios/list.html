<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Usuarios')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb" th:text="#{nav.usuarios}">Usuarios</div>
        <div class="page-header">
            <h1 th:text="#{usuarios.h1}">Gestion de Usuarios</h1>
            <div class="page-actions"><a th:href="@{/usuarios/nuevo}" class="btn btn-primary" th:text="#{usuarios.nuevo}">+ Nuevo Usuario</a></div>
        </div>

        <form class="filtros-bar" method="get" th:action="@{/usuarios}">
            <div class="form-group"><label th:text="#{common.buscar}">Buscar</label><input type="text" name="texto" th:value="${texto}" th:placeholder="#{usuarios.buscarPlaceholder}" placeholder="Nombre o email"/></div>
            <div class="form-group">
                <label th:text="#{usuarios.rolLabel}">Rol</label>
                <select name="rol" onchange="this.form.submit()">
                    <option value="" th:text="#{usuarios.todosRoles}">Todos los roles</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.etiqueta}" th:selected="${r == rolSeleccionado}"></option>
                </select>
            </div>
            <div class="checkbox-row" style="height:38px">
                <input type="checkbox" id="soloActivos" name="soloActivos" value="true" th:checked="${soloActivos}"/>
                <label for="soloActivos" style="margin:0" th:text="#{usuarios.soloActivos}">Solo activos</label>
            </div>
            <button type="submit" class="btn btn-secondary compacto" th:text="#{common.filtrar}">Filtrar</button>
        </form>

        <div class="tabla-wrapper" th:if="${usuarios.hasContent()}">
            <table class="tarjetas-en-tablet">
                <thead><tr><th th:text="#{edfisica.colNombre}">Nombre</th><th th:text="#{usuarios.colRoles}">Roles</th><th th:text="#{common.estado}">Estado</th><th th:text="#{usuarios.colUltimoAcceso}">Ultimo acceso</th><th class="acciones" th:text="#{common.acciones}">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="u : ${usuarios.content}" th:with="hoy=${T(java.time.LocalDate).now()}, ayer=${hoy.minusDays(1)}">
                    <td data-label="Nombre">
                        <div style="display:flex;align-items:center;gap:10px">
                            <div class="avatar" th:text="${#strings.substring(u.nombreCompleto,0,1)}">U</div>
                            <div>
                                <div th:text="${u.nombreCompleto}">Nombre</div>
                                <span class="texto-secundario" th:text="${u.email}">email@wellspringschool.edu.ar</span>
                            </div>
                        </div>
                    </td>
                    <td data-label="Roles">
                        <span class="chip chip-gris" th:each="rol : ${u.roles}" th:text="${rol.etiqueta}" style="margin-right:4px"></span>
                    </td>
                    <td data-label="Estado">
                        <span class="chip chip-verde" th:if="${u.activo}" th:text="#{estado.activo}">Activo</span>
                        <span class="chip chip-rojo" th:unless="${u.activo}" th:text="#{estado.inactivo}">Inactivo</span>
                    </td>
                    <td data-label="Ultimo acceso"
                        th:text="${u.ultimoAcceso == null} ? '-' : (${u.ultimoAcceso.toLocalDate().equals(hoy)} ? (#{common.hoy} + ', ' + ${#temporals.format(u.ultimoAcceso,'HH:mm')}) : (${u.ultimoAcceso.toLocalDate().equals(ayer)} ? (#{common.ayer} + ', ' + ${#temporals.format(u.ultimoAcceso,'HH:mm')}) : ${#temporals.format(u.ultimoAcceso,'dd/MM/yyyy HH:mm')}))">-</td>
                    <td data-label="Acciones" class="acciones">
                        <div>
                            <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-secondary compacto" th:text="#{accion.editar}">Editar</a>
                            <a th:href="@{/usuarios/{id}/accesos(id=${u.id})}" class="btn btn-icon" th:title="#{usuarios.historialAccesos}" title="Historial de accesos">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.4" y="3.4" width="15.2" height="17.2" rx="1.6"/><path d="M8 8.4h8"/><path d="M8 12.4h8"/><path d="M8 16.4h5"/></svg>
                            </a>
                            <form th:action="@{/usuarios/{id}/resetear-password(id=${u.id})}" method="post" style="display:inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-ghost compacto" th:attr="data-confirm=#{usuarios.confirmResetPassword}" data-confirm="Se generara una nueva contraseña temporal y se enviara por email. ¿Confirmar?" th:text="#{usuarios.resetearPassword}">Resetear password</button>
                            </form>
                            <form th:action="@{/usuarios/{id}/desactivar(id=${u.id})}" method="post" style="display:inline" th:if="${u.activo}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-danger-suave compacto"
                                        th:attr="data-confirm=#{usuarios.confirmDesactivar(${u.nombreCompleto})},data-confirm-boton=#{usuarios.confirmDesactivarBoton}"
                                        th:text="#{usuarios.desactivar}">Desactivar</button>
                            </form>
                            <form th:action="@{/usuarios/{id}/activar(id=${u.id})}" method="post" style="display:inline" th:unless="${u.activo}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-success compacto" th:text="#{usuarios.activar}">Activar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:unless="${usuarios.hasContent()}">
            <div class="icono">&#128100;</div>
            <h3 th:text="#{usuarios.vacio}">No hay usuarios para mostrar</h3>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
