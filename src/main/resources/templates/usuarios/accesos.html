<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Historial de accesos')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/usuarios}" th:text="#{nav.usuarios}">Usuarios</a> &gt; <span th:text="#{usuarios.historialAccesos}">Historial de accesos</span></div>
        <h1 th:text="#{usuarios.historialDe} + ' ' + ${usuario.nombreCompleto}">Historial</h1>

        <div class="tabla-wrapper" th:if="${registros.hasContent()}">
            <table>
                <thead><tr><th th:text="#{alumnos.legajo.colFecha}">Fecha</th><th th:text="#{usuarios.colAccion}">Accion</th><th th:text="#{usuarios.colIp}">IP</th></tr></thead>
                <tbody>
                <tr th:each="r : ${registros.content}">
                    <td data-label="Fecha" th:text="${#temporals.format(r.timestamp,'dd/MM/yyyy HH:mm:ss')}">-</td>
                    <td data-label="Accion" th:text="${r.accion}">-</td>
                    <td data-label="IP" th:text="${r.ipAddress}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:unless="${registros.hasContent()}">
            <p th:text="#{usuarios.sinRegistrosAuditoria}">Sin registros de auditoria para este usuario todavia.</p>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
