<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Asistencia - Educacion Fisica')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.educacionFisica}">Educacion Fisica</span> &gt; <span th:text="#{edfisica.asistencia.h1}">Asistencia</span></div>
        <h1 th:text="#{edfisica.asistencia.h1}">Toma de Asistencia - Educacion Fisica</h1>

        <form method="get" th:action="@{/educacion-fisica/asistencia}" class="filtros-bar">
            <div class="form-group">
                <label th:text="#{edfisica.grupo}">Grupo</label>
                <select name="grupoId" onchange="this.form.submit()">
                    <option value="">-</option>
                    <option th:each="g : ${grupos}" th:value="${g.id}" th:text="${g.nombre}" th:selected="${g.id == grupoSeleccionado}"></option>
                </select>
            </div>
            <div class="form-group">
                <label th:text="#{alumnos.legajo.colFecha}">Fecha</label>
                <input type="date" name="fecha" th:value="${#temporals.format(fecha,'yyyy-MM-dd')}"/>
            </div>
            <button type="submit" class="btn btn-secondary compacto" th:text="#{edfisica.asistencia.verFecha}">Ver</button>
        </form>

        <form th:action="@{/educacion-fisica/asistencia}" method="post" th:if="${alumnos != null}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="grupoId" th:value="${grupoSeleccionado}"/>
            <input type="hidden" name="fecha" th:value="${#temporals.format(fecha,'yyyy-MM-dd')}"/>

            <div class="tabla-wrapper">
                <table class="tabla-asistencia">
                    <thead><tr><th>#</th><th th:text="#{alumnos.colApellidoNombre}">Apellido y Nombre</th><th th:text="#{common.estado}">Estado</th></tr></thead>
                    <tbody>
                    <tr th:each="alumno, iter : ${alumnos}" th:with="tipoActual=${estadoActual.get(alumno.id)}">
                        <td data-label="#" th:text="${iter.count}">1</td>
                        <td data-label="Alumno" th:text="${alumno.nombreCompleto}">-</td>
                        <td data-label="Estado">
                            <input type="hidden" th:name="|items[${iter.index}].alumnoId|" th:value="${alumno.id}"/>
                            <select th:name="|items[${iter.index}].tipo|">
                                <option value="PRESENTE" th:selected="${tipoActual == null or tipoActual.name() == 'PRESENTE'}" th:text="#{asistencia.tipo.presente}">Presente</option>
                                <option value="AUSENTE" th:selected="${tipoActual != null and tipoActual.name() == 'AUSENTE'}" th:text="#{asistencia.tipo.ausente}">Ausente</option>
                                <option value="LLEGADA_TARDE" th:selected="${tipoActual != null and tipoActual.name() == 'LLEGADA_TARDE'}" th:text="#{asistencia.tipo.llegadaTarde}">1/4 Llegada Tarde</option>
                                <option value="SAF" th:selected="${tipoActual != null and tipoActual.name() == 'SAF'}" th:text="#{edfisica.asistencia.saf}">SAF - Sin Apto Fisico hoy</option>
                            </select>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:12px" th:text="#{asistencia.guardar}">Guardar Asistencia</button>
        </form>

        <div class="estado-vacio" th:if="${alumnos == null}">
            <h3 th:text="#{edfisica.asistencia.seleccioneGrupo}">Seleccione un grupo</h3>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
