<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/head :: head(titulo='Restricciones Medicas')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.educacionFisica}">Educacion Fisica</span> &gt; <span th:text="#{edfisica.restriccionesMedicas}">Restricciones Medicas</span></div>
        <h1 th:text="#{edfisica.restriccionesMedicas}">Restricciones Medicas</h1>

        <div class="card" sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')">
            <h3 th:text="#{edfisica.nuevaRestriccion}">+ Nueva Restriccion</h3>
            <form th:action="@{/educacion-fisica/restricciones}" th:object="${restriccionForm}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{disciplina.alumnoRequerido}">Alumno*</label>
                        <select th:field="*{alumnoId}">
                            <option th:each="a : ${alumnos}" th:value="${a.id}" th:text="${a.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="form-group"><label th:text="#{edfisica.fechaInicio}">Fecha inicio*</label><input type="date" th:field="*{fechaInicio}"/></div>
                    <div class="form-group"><label th:text="#{edfisica.fechaFin}">Fecha fin</label><input type="date" th:field="*{fechaFin}"/></div>
                </div>
                <div class="form-group"><label th:text="#{edfisica.descripcionRequerida}">Descripcion*</label><textarea th:field="*{descripcion}"></textarea></div>
                <div class="form-group"><label th:text="#{edfisica.certificadoMedico}">Certificado medico (PDF/imagen)</label><input type="file" name="documento"/></div>
                <button type="submit" class="btn btn-primary compacto" th:text="#{edfisica.registrarRestriccion}">Registrar Restriccion</button>
            </form>
        </div>

        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(restricciones)}">
            <table>
                <thead><tr><th th:text="#{calificaciones.colAlumno}">Alumno</th><th th:text="#{alumnos.legajo.colDescripcion}">Descripcion</th><th th:text="#{edfisica.desde}">Desde</th><th th:text="#{edfisica.hasta}">Hasta</th><th th:text="#{common.estado}">Estado</th></tr></thead>
                <tbody>
                <tr th:each="r : ${restricciones}">
                    <td data-label="Alumno" th:text="${r.alumno.nombreCompleto}">-</td>
                    <td data-label="Descripcion" th:text="${r.descripcion}">-</td>
                    <td data-label="Desde" th:text="${#temporals.format(r.fechaInicio,'dd/MM/yyyy')}">-</td>
                    <td data-label="Hasta" th:text="${r.fechaFin != null} ? ${#temporals.format(r.fechaFin,'dd/MM/yyyy')} : #{edfisica.indefinida}">-</td>
                    <td data-label="Estado">
                        <span class="chip chip-naranja" th:if="${r.activa}" th:text="#{edfisica.activa}">Activa</span>
                        <span class="chip chip-gris" th:unless="${r.activa}" th:text="#{edfisica.vencida}">Vencida</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(restricciones)}"><h3 th:text="#{edfisica.vacioRestricciones}">No hay restricciones medicas registradas</h3></div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
