<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Restablecer contraseña')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1 th:text="#{auth.restablecerPassword.h1}">Restablecer contraseña</h1>
        <form th:action="@{/restablecer-password}" th:object="${resetPasswordForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{token}"/>
            <div class="form-group">
                <label for="passwordNueva" th:text="#{auth.passwordNueva}">Nueva contraseña</label>
                <div class="campo-password">
                    <input type="password" id="passwordNueva" th:field="*{passwordNueva}"
                           th:classappend="${#fields.hasErrors('passwordNueva')} ? 'error'"/>
                    <button type="button" class="btn-mostrar-password"
                            th:attr="data-target='passwordNueva',data-mostrar=#{login.mostrar},data-ocultar=#{login.ocultar}"
                            th:text="#{login.mostrar}">Mostrar</button>
                </div>
                <div class="error-mensaje" th:if="${#fields.hasErrors('passwordNueva')}" th:errors="*{passwordNueva}"></div>
                <div class="texto-secundario" th:text="#{auth.passwordHint}">Minimo 8 caracteres, 1 mayuscula, 1 numero y 1 caracter especial.</div>
            </div>
            <div class="form-group">
                <label for="passwordConfirmacion" th:text="#{auth.passwordConfirmacion}">Confirmar nueva contraseña</label>
                <div class="campo-password">
                    <input type="password" id="passwordConfirmacion" th:field="*{passwordConfirmacion}"
                           th:classappend="${#fields.hasErrors('passwordConfirmacion')} ? 'error'"/>
                    <button type="button" class="btn-mostrar-password"
                            th:attr="data-target='passwordConfirmacion',data-mostrar=#{login.mostrar},data-ocultar=#{login.ocultar}"
                            th:text="#{login.mostrar}">Mostrar</button>
                </div>
                <div class="error-mensaje" th:if="${#fields.hasErrors('passwordConfirmacion')}" th:errors="*{passwordConfirmacion}"></div>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{auth.restablecerPassword.submit}">Restablecer</button>
        </form>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
