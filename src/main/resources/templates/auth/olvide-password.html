<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Recuperar contraseña')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1 th:text="#{auth.olvidePassword.h1}">Recuperar contraseña</h1>
        <p class="subtitulo" th:text="#{auth.olvidePassword.subtitulo}">Te enviaremos un enlace para restablecerla.</p>

        <div class="alert-banner info" th:if="${enviado}" th:text="#{auth.olvidePassword.enviado}">
            Si el email esta registrado, recibiras un enlace de recuperacion en los proximos minutos.
        </div>

        <form th:action="@{/olvide-password}" th:object="${forgotPasswordForm}" method="post" th:unless="${enviado}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="email" th:text="#{login.email}">Email institucional</label>
                <input type="email" id="email" th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'error'"/>
                <div class="error-mensaje" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{auth.olvidePassword.submit}">Enviar enlace</button>
        </form>
        <div class="auth-links"><a th:href="@{/login}" th:text="#{auth.volverLogin}">Volver a iniciar sesion</a></div>
    </div>
</div>
</body>
</html>
