<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Iniciar sesion')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-logo">
            <img th:src="@{/img/logo.jpg}" alt="Wellspring School"/>
            <span class="institucion" th:text="#{app.institucion}">Wellspring School</span>
        </div>
        <h1 th:text="#{login.h1}">Ingresa a tu cuenta</h1>

        <div class="alert-banner error" th:if="${error == 'credenciales'}" th:text="#{login.error.credenciales}">Email o contraseña incorrectos.</div>
        <div class="alert-banner error" th:if="${error == 'bloqueado'}" th:text="#{login.error.bloqueado}">
            Cuenta bloqueada temporalmente por intentos fallidos. Intente en unos minutos.
        </div>
        <div class="alert-banner info" th:if="${logout}" th:text="#{login.logoutOk}">Sesion cerrada correctamente.</div>
        <div class="alert-banner info" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="email" th:text="#{login.email}">Email institucional</label>
                <input type="email" id="email" name="email" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password" th:text="#{login.password}">Contraseña</label>
                <div class="campo-password">
                    <input type="password" id="password" name="password" required/>
                    <button type="button" class="btn-mostrar-password"
                            th:attr="data-target='password',data-mostrar=#{login.mostrar},data-ocultar=#{login.ocultar}"
                            th:text="#{login.mostrar}">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{login.submit}">Ingresar</button>
        </form>
        <div class="auth-links">
            <a th:href="@{/olvide-password}" th:text="#{login.olvidoPassword}">Olvide mi contraseña</a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
