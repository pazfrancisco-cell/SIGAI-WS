<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Cambiar contraseña')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-card">
        <h1 th:text="#{auth.cambiarPassword.h1}">Cambiar contraseña</h1>
        <p class="subtitulo" th:text="#{auth.cambiarPassword.subtitulo}">Debes actualizar tu contraseña para continuar.</p>

        <form th:action="@{/cambiar-password}" th:object="${changePasswordForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="passwordActual" th:text="#{auth.passwordActual}">Contraseña actual</label>
                <div class="campo-password">
                    <input type="password" id="passwordActual" th:field="*{passwordActual}"
                           th:classappend="${#fields.hasErrors('passwordActual')} ? 'error'"/>
                    <button type="button" class="btn-mostrar-password"
                            th:attr="data-target='passwordActual',data-mostrar=#{login.mostrar},data-ocultar=#{login.ocultar}"
                            th:text="#{login.mostrar}">Mostrar</button>
                </div>
                <div class="error-mensaje" th:if="${#fields.hasErrors('passwordActual')}" th:errors="*{passwordActual}"></div>
            </div>
            <div class="form-group">
                <label for="passwordNueva" th:text="#{auth.passwordNueva}">Nueva contraseña</label>
                <div class="campo-password">
                    <input type="password" id="passwordNueva" th:field="*{passwordNueva}"
                           th:classappend="${#fields.hasErrors('passwordNueva')} ? 'error'"/>
                    <button type="button" class="btn-mostrar-password"
                            th:attr="data-target='passwordNueva',data-mostrar=#{login.mostrar},data-ocultar=#{login.ocultar}"
                            th:text="#{login.mostrar}">Mostrar</button>
                </div>
                <div class="error-mensaje" th:if="${#fields.hasErrors('passwordNueva')}" th:errors="*{passwordNueva}"></div>
                <div class="texto-secundario" th:text="#{auth.passwordHint}">Minimo 8 caracteres, 1 mayuscula, 1 numero y 1 caracter especial.</div>
            </div>
            <div class="form-group">
                <label for="passwordConfirmacion" th:text="#{auth.passwordConfirmacion}">Confirmar nueva contraseña</label>
                <div class="campo-password">
                    <input type="password" id="passwordConfirmacion" th:field="*{passwordConfirmacion}"
                           th:classappend="${#fields.hasErrors('passwordConfirmacion')} ? 'error'"/>
                    <button type="button" class="btn-mostrar-password"
                            th:attr="data-target='passwordConfirmacion',data-mostrar=#{login.mostrar},data-ocultar=#{login.ocultar}"
                            th:text="#{login.mostrar}">Mostrar</button>
                </div>
                <div class="error-mensaje" th:if="${#fields.hasErrors('passwordConfirmacion')}" th:errors="*{passwordConfirmacion}"></div>
            </div>
            <button type="submit" class="btn btn-primary" th:text="#{auth.cambiarPassword.submit}">Actualizar contraseña</button>
        </form>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
