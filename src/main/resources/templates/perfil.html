<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Mi Perfil')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb" th:text="#{perfil.titulo}">Mi Perfil</div>
        <h1 th:text="#{perfil.titulo}">Mi Perfil</h1>

        <div class="card" style="max-width:480px">
            <div class="form-group">
                <label th:text="#{perfil.nombreCompleto}">Nombre completo</label>
                <div th:text="${usuario.nombreCompleto}">-</div>
            </div>
            <div class="form-group">
                <label th:text="#{login.email}">Email institucional</label>
                <div th:text="${usuario.email}">-</div>
            </div>
            <div class="form-group">
                <label th:text="#{perfil.rolesActivos}">Rol(es) activo(s)</label>
                <div>
                    <span class="chip chip-verde" th:each="rol : ${usuario.roles}" th:text="${rol.nombre.etiqueta}" style="margin-right:6px">-</span>
                </div>
            </div>
            <div class="form-group" th:if="${usuario.ultimoAcceso}">
                <label th:text="#{usuarios.colUltimoAcceso}">Ultimo acceso</label>
                <div th:text="${#temporals.format(usuario.ultimoAcceso,'dd/MM/yyyy HH:mm')}">-</div>
            </div>

            <div class="page-actions" style="margin-top:12px">
                <a th:href="@{/cambiar-password}" class="btn btn-secondary" th:text="#{topbar.cambiarPassword}">Cambiar contraseña</a>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
