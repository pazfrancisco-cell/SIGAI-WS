<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Editar Observacion')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/alumnos/{id}(id=${alumno.id})}" th:text="#{asistencia.legajoLabel}">Legajo</a> &gt; <span th:text="#{disciplina.editarObs}">Editar Observacion</span></div>
        <h1><span th:text="#{disciplina.editarObsDe}">Editar Observacion de</span> <span th:text="${alumno.nombreCompleto}">-</span></h1>

        <form th:action="@{/disciplina/observaciones/{id}/editar(id=${observacionId})}" th:object="${observacionForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-row">
                <div class="form-group">
                    <label th:text="#{calificaciones.fechaRequerido}">Fecha*</label>
                    <input type="date" th:field="*{fecha}"/>
                </div>
                <div class="form-group">
                    <label th:text="#{disciplina.categoria}">Categoria</label>
                    <select th:field="*{categoria}">
                        <option value="Conducta en clase" th:text="#{disciplina.cat.conducta}">Conducta en clase</option>
                        <option value="Incumplimiento de normas" th:text="#{disciplina.cat.incumplimiento}">Incumplimiento de normas</option>
                        <option value="Falta de respeto" th:text="#{disciplina.cat.faltaRespeto}">Falta de respeto</option>
                        <option value="Daño a la propiedad" th:text="#{disciplina.cat.danio}">Daño a la propiedad</option>
                        <option value="Otra" th:text="#{common.otro}">Otra</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label th:text="#{disciplina.descripcionObs}">Descripcion de la observacion* (min 20 caracteres)</label>
                <textarea th:field="*{descripcion}" th:classappend="${#fields.hasErrors('descripcion')} ? 'error'"></textarea>
                <div class="error-mensaje" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
            </div>
            <div class="form-group">
                <label th:text="#{disciplina.firmantesAdicionales}">Firmantes adicionales</label>
                <input type="text" th:field="*{firmantesAdicionales}"/>
            </div>
            <input type="hidden" th:field="*{alumnoId}"/>
            <input type="hidden" th:field="*{cantidad}"/>
            <div class="page-actions">
                <a th:href="@{/alumnos/{id}(id=${alumno.id})}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{calificaciones.guardarCambios}">Guardar cambios</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
