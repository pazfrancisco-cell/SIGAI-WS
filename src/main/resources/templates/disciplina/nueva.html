<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Nueva Observacion')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.disciplina}">Disciplina</span> &gt; <span th:text="#{disciplina.nuevaObs}">Nueva Observacion</span></div>
        <h1 th:text="#{disciplina.registro.h1}">Registro de Observacion</h1>
        <div class="alert-banner info" th:text="#{disciplina.firmaAutoInfo}">Al llegar a un multiplo de 5 observaciones se genera automaticamente una Firma Disciplinaria y se notifica a los tutores y a Direccion.</div>

        <form th:action="@{/disciplina/nueva}" th:object="${observacionBatchForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div id="observaciones-contenedor">
                <div class="observacion-fieldset card" th:each="obs, iter : *{observaciones}" style="margin-bottom:16px">
                    <div class="form-row">
                        <div class="form-group">
                            <label th:text="#{disciplina.alumnoRequerido}">Alumno*</label>
                            <select th:field="*{observaciones[__${iter.index}__].alumnoId}">
                                <option th:each="a : ${alumnos}" th:value="${a.id}" th:text="${a.nombreCompleto}"></option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label th:text="#{calificaciones.fechaRequerido}">Fecha*</label>
                            <input type="date" th:field="*{observaciones[__${iter.index}__].fecha}"/>
                        </div>
                        <div class="form-group">
                            <label th:text="#{disciplina.categoria}">Categoria</label>
                            <select th:field="*{observaciones[__${iter.index}__].categoria}">
                                <option value="Conducta en clase" th:text="#{disciplina.cat.conducta}">Conducta en clase</option>
                                <option value="Incumplimiento de normas" th:text="#{disciplina.cat.incumplimiento}">Incumplimiento de normas</option>
                                <option value="Falta de respeto" th:text="#{disciplina.cat.faltaRespeto}">Falta de respeto</option>
                                <option value="Daño a la propiedad" th:text="#{disciplina.cat.danio}">Daño a la propiedad</option>
                                <option value="Otra" th:text="#{common.otro}">Otra</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label th:text="#{disciplina.gravedad}">Gravedad (cantidad de observaciones)*</label>
                            <select th:field="*{observaciones[__${iter.index}__].cantidad}">
                                <option value="1" th:text="#{disciplina.grav.leve}">1 - Leve</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5" th:text="#{disciplina.grav.generaFirma}">5 - Genera Firma</option>
                                <option value="10" th:text="#{disciplina.grav.grave}">10 - Grave</option>
                                <option value="15">15</option>
                                <option value="20" th:text="#{disciplina.grav.muyGrave}">20 - Muy grave</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label th:text="#{disciplina.descripcionObs}">Descripcion de la observacion* (min 20 caracteres)</label>
                        <textarea th:field="*{observaciones[__${iter.index}__].descripcion}"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label th:text="#{disciplina.firmantesAdicionales}">Firmantes adicionales</label>
                            <input type="text" th:field="*{observaciones[__${iter.index}__].firmantesAdicionales}"/>
                        </div>
                        <div class="form-group" style="display:flex;align-items:flex-end">
                            <button type="button" class="btn btn-ghost compacto" data-quitar-observacion="true" th:text="#{alumnos.form.tutorQuitar}">Quitar</button>
                        </div>
                    </div>
                </div>
            </div>
            <button type="button" id="btn-agregar-observacion" class="btn btn-secondary compacto" th:text="#{disciplina.agregarOtraObs}">+ Agregar otra observacion</button>

            <div class="page-actions" style="margin-top:20px">
                <button type="submit" class="btn btn-primary" th:text="#{disciplina.registrarObservaciones}">Registrar Observaciones</button>
            </div>
        </form>

        <!-- Plantilla usada por app.js para agregar una nueva observacion dinamicamente -->
        <template id="observacion-template">
            <div class="observacion-fieldset card" style="margin-bottom:16px">
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{disciplina.alumnoRequerido}">Alumno*</label>
                        <select name="observaciones[__INDEX__].alumnoId">
                            <option th:each="a : ${alumnos}" th:value="${a.id}" th:text="${a.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{calificaciones.fechaRequerido}">Fecha*</label>
                        <input type="date" name="observaciones[__INDEX__].fecha" th:value="${#temporals.format(#temporals.createNow(),'yyyy-MM-dd')}"/>
                    </div>
                    <div class="form-group">
                        <label th:text="#{disciplina.categoria}">Categoria</label>
                        <select name="observaciones[__INDEX__].categoria">
                            <option value="Conducta en clase" th:text="#{disciplina.cat.conducta}">Conducta en clase</option>
                            <option value="Incumplimiento de normas" th:text="#{disciplina.cat.incumplimiento}">Incumplimiento de normas</option>
                            <option value="Falta de respeto" th:text="#{disciplina.cat.faltaRespeto}">Falta de respeto</option>
                            <option value="Daño a la propiedad" th:text="#{disciplina.cat.danio}">Daño a la propiedad</option>
                            <option value="Otra" th:text="#{common.otro}">Otra</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{disciplina.gravedad}">Gravedad (cantidad de observaciones)*</label>
                        <select name="observaciones[__INDEX__].cantidad">
                            <option value="1" selected="selected" th:text="#{disciplina.grav.leve}">1 - Leve</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5" th:text="#{disciplina.grav.generaFirma}">5 - Genera Firma</option>
                            <option value="10" th:text="#{disciplina.grav.grave}">10 - Grave</option>
                            <option value="15">15</option>
                            <option value="20" th:text="#{disciplina.grav.muyGrave}">20 - Muy grave</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label th:text="#{disciplina.descripcionObs}">Descripcion de la observacion* (min 20 caracteres)</label>
                    <textarea name="observaciones[__INDEX__].descripcion"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{disciplina.firmantesAdicionales}">Firmantes adicionales</label>
                        <input type="text" name="observaciones[__INDEX__].firmantesAdicionales"/>
                    </div>
                    <div class="form-group" style="display:flex;align-items:flex-end">
                        <button type="button" class="btn btn-ghost compacto" data-quitar-observacion="true" th:text="#{alumnos.form.tutorQuitar}">Quitar</button>
                    </div>
                </div>
            </div>
        </template>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
