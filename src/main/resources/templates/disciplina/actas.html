<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Gestion de Actas')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.disciplina}">Disciplina</span> &gt; <span th:text="#{disciplina.gestionActas}">Gestion de Actas</span></div>
        <h1 th:text="#{disciplina.gestionActas}">Gestion de Actas</h1>

        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(alumnosConActaPendiente)}">
            <table>
                <thead><tr><th th:text="#{calificaciones.colAlumno}">Alumno</th><th th:text="#{disciplina.colFirmasAcumuladasMin}">Firmas acumuladas</th><th th:text="#{disciplina.colActaSugerida}">Acta sugerida</th></tr></thead>
                <tbody>
                <tr th:each="acl : ${alumnosConActaPendiente}">
                    <td data-label="Alumno" th:text="${acl.alumno.nombreCompleto}">-</td>
                    <td data-label="Firmas" th:text="${acl.firmasAcumuladas}">-</td>
                    <td data-label="Acta sugerida" th:text="${acl.firmasAcumuladas >= 5} ? #{disciplina.matriculacion} : #{disciplina.acuerdo}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(alumnosConActaPendiente)}"><h3 th:text="#{disciplina.vacioActas}">No hay alumnos con actas pendientes</h3></div>

        <div class="card" style="margin-top:20px">
            <h3 th:text="#{disciplina.generarActa}">Generar Acta</h3>
            <form th:action="@{/disciplina/actas}" th:object="${actaForm}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-row">
                    <div class="form-group">
                        <label th:text="#{disciplina.alumnoRequerido}">Alumno*</label>
                        <select th:field="*{alumnoId}">
                            <option th:each="acl : ${alumnosConActaPendiente}" th:value="${acl.alumno.id}" th:text="${acl.alumno.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{calificaciones.tipoRequerido}">Tipo*</label>
                        <select th:field="*{tipo}">
                            <option value="ACUERDO" th:text="#{disciplina.actaAcuerdo}">Acta de Acuerdo</option>
                            <option value="MATRICULACION" th:text="#{disciplina.actaMatriculacion}">Acta de Matriculacion</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label th:text="#{disciplina.contenido}">Contenido* (situacion y acciones acordadas)</label>
                    <textarea th:field="*{contenido}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" th:attr="data-confirm=#{disciplina.confirmGenerarActa}" data-confirm="Se generara el acta y se notificara a los tutores. ¿Confirmar?" th:text="#{disciplina.generarActa}">Generar Acta</button>
            </form>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
