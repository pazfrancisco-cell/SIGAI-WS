<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Asistencia - Docente')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.asistencia}">Asistencia</span> &gt; <span th:text="#{asistencia.docenteLabel}">Docente</span></div>
        <h1 th:text="#{asistencia.docente.h1}">Toma de Asistencia - Docente</h1>
        <p class="texto-secundario" th:text="${#temporals.format(fecha,'dd/MM/yyyy')}">Fecha</p>

        <form method="get" th:action="@{/asistencia/docente}" class="filtros-bar">
            <div class="form-group">
                <label th:text="#{common.materia}">Materia</label>
                <select name="materiaId" onchange="this.form.submit()">
                    <option value="">-</option>
                    <option th:each="m : ${materias}" th:value="${m.id}" th:text="${m.nombre}"
                            th:selected="${m.id == materiaSeleccionada}"></option>
                </select>
            </div>
            <div class="form-group">
                <label th:text="#{common.cursoDivision}">Curso/Division</label>
                <select name="cursoDivisionId" onchange="this.form.submit()">
                    <option value="">-</option>
                    <option th:each="cd : ${cursosDivisiones}" th:value="${cd.id}" th:text="${cd.nombreCompleto}"
                            th:selected="${cd.id == divisionSeleccionada}"></option>
                </select>
            </div>
        </form>

        <form th:action="@{/asistencia/docente}" method="post" th:if="${alumnos != null}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="materiaId" th:value="${materiaSeleccionada}"/>
            <input type="hidden" name="cursoDivisionId" th:value="${divisionSeleccionada}"/>
            <input type="hidden" name="fecha" th:value="${#temporals.format(fecha,'yyyy-MM-dd')}"/>

            <div class="tabla-wrapper">
                <table class="tabla-asistencia">
                    <thead><tr><th>#</th><th th:text="#{alumnos.colApellidoNombre}">Apellido y Nombre</th><th th:text="#{common.estado}">Estado</th><th th:text="#{asistencia.colObservacion}">Observacion</th></tr></thead>
                    <tbody>
                    <tr th:each="alumno, iter : ${alumnos}">
                        <td data-label="#" th:text="${iter.count}">1</td>
                        <td data-label="Alumno" th:text="${alumno.nombreCompleto}">-</td>
                        <td data-label="Estado">
                            <input type="hidden" th:name="|items[${iter.index}].alumnoId|" th:value="${alumno.id}"/>
                            <select th:name="|items[${iter.index}].tipo|">
                                <option value="PRESENTE" selected="selected" th:text="#{asistencia.tipo.presente}">Presente</option>
                                <option value="AUSENTE" th:text="#{asistencia.tipo.ausente}">Ausente</option>
                                <option value="LLEGADA_TARDE" th:text="#{asistencia.tipo.llegadaTarde}">1/4 Llegada Tarde</option>
                            </select>
                        </td>
                        <td data-label="Observacion">
                            <input type="text" th:name="|items[${iter.index}].observacion|" style="height:30px"/>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:12px" th:text="#{asistencia.guardar}">Guardar Asistencia</button>
        </form>

        <div class="estado-vacio" th:if="${alumnos == null}">
            <h3 th:text="#{asistencia.seleccioneMateriaCurso}">Seleccione materia y curso/division</h3>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
