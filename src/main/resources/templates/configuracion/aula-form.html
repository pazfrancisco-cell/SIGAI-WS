<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Aula')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/configuracion/aulas}" th:text="#{nav.aulas}">Aulas</a> &gt; <span th:text="${aulaForm.id != null} ? #{accion.editar} : #{aulas.nuevaLabel}"></span></div>
        <h1 th:text="${aulaForm.id != null} ? #{aulas.tituloEditar} : #{aulas.tituloNueva}">Aula</h1>
        <form th:action="@{/configuracion/aulas}" th:object="${aulaForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label th:text="#{alumnos.form.nombre}">Nombre*</label>
                <input type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'error'"/>
                <div class="error-mensaje" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="form-group"><label th:text="#{aulas.colCapacidad}">Capacidad</label><input type="number" th:field="*{capacidad}"/></div>
            <div class="checkbox-row"><input type="checkbox" id="activa" th:field="*{activa}"/><label for="activa" style="margin:0" th:text="#{estado.activo.f}">Activa</label></div>
            <div class="page-actions">
                <a th:href="@{/configuracion/aulas}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
