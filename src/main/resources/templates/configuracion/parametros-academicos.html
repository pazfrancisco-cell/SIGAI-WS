<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Parametros Academicos')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.configuracion}">Configuracion</span> &gt; <span th:text="#{nav.parametrosAcademicos}">Parametros Academicos</span></div>
        <h1 th:text="#{nav.parametrosAcademicos}">Parametros Academicos</h1>
        <p class="texto-secundario" th:text="#{parametros.subtitulo}">Valores por defecto: umbrales 10/15/20/28, nota minima 7, bajo rendimiento 6, asistencia por materia 75%.</p>

        <form th:action="@{/configuracion/parametros-academicos}" th:object="${parametroAcademicoForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <h3 th:text="#{parametros.umbralesInasistencias}">Umbrales de inasistencias</h3>
            <div class="form-row">
                <div class="form-group"><label th:text="#{parametros.umbral1}">Umbral 1 (alerta preceptor+tutor)</label><input type="number" th:field="*{umbralFalta1}"/></div>
                <div class="form-group"><label th:text="#{parametros.umbral2}">Umbral 2 (alerta directivo)</label><input type="number" th:field="*{umbralFalta2}"/></div>
                <div class="form-group"><label th:text="#{parametros.umbral3}">Umbral 3 (evaluacion justificadas)</label><input type="number" th:field="*{umbralFalta3}"/></div>
                <div class="form-group"><label th:text="#{parametros.umbral4}">Umbral 4 (Condicion Libre)</label><input type="number" th:field="*{umbralFalta4CondicionLibre}"/></div>
            </div>
            <h3 th:text="#{parametros.calificacionesAsistencia}">Calificaciones y asistencia</h3>
            <div class="form-row">
                <div class="form-group"><label th:text="#{parametros.notaMinima}">Nota minima de aprobacion</label><input type="number" step="0.1" th:field="*{notaMinimaAprobacion}"/></div>
                <div class="form-group"><label th:text="#{parametros.umbralBajoRendimiento}">Umbral de bajo rendimiento</label><input type="number" step="0.1" th:field="*{umbralBajoRendimiento}"/></div>
                <div class="form-group"><label th:text="#{parametros.porcentajeAsistencia}">% asistencia minima por materia</label><input type="number" step="0.01" th:field="*{porcentajeAsistenciaMateria}"/></div>
            </div>
            <div class="page-actions">
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
