<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Materia')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/configuracion/materias}" th:text="#{nav.materias.materias}">Materias</a> &gt; <span th:text="${materiaForm.id != null} ? #{accion.editar} : #{aulas.nuevaLabel}"></span></div>
        <h1 th:text="${materiaForm.id != null} ? #{materias.tituloEditar} : #{materias.tituloNueva}">Materia</h1>

        <form th:action="@{/configuracion/materias}" th:object="${materiaForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label th:text="#{alumnos.form.nombre}">Nombre*</label>
                <input type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'error'"/>
                <div class="error-mensaje" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="form-group">
                <label th:text="#{materias.cursosDivisionesRequerido}">Cursos / Divisiones*</label>
                <div class="checkbox-row" th:each="cd : ${cursosDivisiones}">
                    <input type="checkbox" th:id="${'cd-' + cd.id}" name="cursoDivisionIds" th:value="${cd.id}"
                           th:checked="${materiaForm.cursoDivisionIds != null and materiaForm.cursoDivisionIds.contains(cd.id)}"/>
                    <label th:for="${'cd-' + cd.id}" style="margin:0" th:text="${cd.nombreCompleto}">1° A</label>
                </div>
            </div>
            <div class="checkbox-row"><input type="checkbox" id="activa" th:field="*{activa}"/><label for="activa" style="margin:0" th:text="#{estado.activo.f}">Activa</label></div>
            <div class="page-actions">
                <a th:href="@{/configuracion/materias}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
