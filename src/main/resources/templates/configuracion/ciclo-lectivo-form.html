<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Nuevo Ciclo Lectivo')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/configuracion/ciclos-lectivos}" th:text="#{nav.horarios.ciclosLectivos}">Ciclos Lectivos</a> &gt; <span th:text="#{accion.nuevo}">Nuevo</span></div>
        <h1 th:text="#{ciclos.nuevo}">Nuevo Ciclo Lectivo</h1>

        <form th:action="@{/configuracion/ciclos-lectivos}" th:object="${cicloLectivoForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label th:text="#{ciclos.anioRequerido}">Año*</label>
                <input type="number" th:field="*{anio}" th:classappend="${#fields.hasErrors('anio')} ? 'error'"/>
                <div class="error-mensaje" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label th:text="#{ciclos.inicioC1}">Inicio C1*</label><input type="date" th:field="*{fechaInicioC1}"/></div>
                <div class="form-group"><label th:text="#{ciclos.finC1}">Fin C1*</label><input type="date" th:field="*{fechaFinC1}"/></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label th:text="#{ciclos.inicioC2}">Inicio C2*</label><input type="date" th:field="*{fechaInicioC2}"/></div>
                <div class="form-group"><label th:text="#{ciclos.finC2}">Fin C2*</label><input type="date" th:field="*{fechaFinC2}"/></div>
            </div>
            <div class="page-actions">
                <a th:href="@{/configuracion/ciclos-lectivos}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
