<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Configuracion SMTP')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.configuracion}">Configuracion</span> &gt; <span th:text="#{nav.smtp}">SMTP</span></div>
        <h1 th:text="#{nav.smtp}">Configuracion SMTP</h1>
        <p class="texto-secundario" th:text="#{smtp.subtitulo}">Si "Usar configuracion personalizada" esta apagado, el sistema envia los emails automaticos con el servidor de correo configurado en el entorno (.env).</p>

        <form th:action="@{/configuracion/smtp}" th:object="${configuracionSmtpForm}" method="post" class="card" style="max-width:560px">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="checkbox-row" style="margin-bottom:16px">
                <input type="checkbox" id="usarConfiguracionPersonalizada" th:field="*{usarConfiguracionPersonalizada}"/>
                <label for="usarConfiguracionPersonalizada" style="margin:0" th:text="#{smtp.usarPersonalizada}">Usar configuracion personalizada</label>
            </div>
            <div class="form-group">
                <label th:text="#{smtp.host}">Host</label>
                <input type="text" th:field="*{host}" placeholder="smtp.midominio.com"/>
            </div>
            <div class="form-row">
                <div class="form-group"><label th:text="#{smtp.puerto}">Puerto</label><input type="number" th:field="*{puerto}" placeholder="587"/></div>
                <div class="form-group"><label th:text="#{smtp.remitente}">Remitente</label><input type="email" th:field="*{remitente}" placeholder="no-reply@wellspringschool.edu.ar"/></div>
            </div>
            <div class="form-group">
                <label th:text="#{smtp.usuario}">Usuario</label>
                <input type="text" th:field="*{usuario}"/>
            </div>
            <div class="form-group">
                <label th:text="#{smtp.contrasena}">Contrasena</label>
                <input type="password" th:field="*{password}" th:placeholder="#{smtp.contrasenaPlaceholder}" placeholder="dejar en blanco para no cambiarla"/>
                <span class="texto-secundario" th:if="${passwordYaConfigurada}" th:text="#{smtp.passwordYaConfigurada}">Ya hay una contrasena guardada.</span>
            </div>
            <div class="checkbox-row" style="margin-bottom:8px">
                <input type="checkbox" id="authHabilitado" th:field="*{authHabilitado}"/>
                <label for="authHabilitado" style="margin:0" th:text="#{smtp.requiereAuth}">Requiere autenticacion</label>
            </div>
            <div class="checkbox-row" style="margin-bottom:16px">
                <input type="checkbox" id="starttlsHabilitado" th:field="*{starttlsHabilitado}"/>
                <label for="starttlsHabilitado" style="margin:0" th:text="#{smtp.usarStarttls}">Usar STARTTLS</label>
            </div>
            <div class="page-actions">
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
