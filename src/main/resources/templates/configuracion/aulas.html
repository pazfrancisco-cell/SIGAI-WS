<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/head :: head(titulo='Aulas')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div th:replace="~{fragments/toasts :: toasts}"></div>
        <div class="breadcrumb"><span th:text="#{nav.configuracion}">Configuracion</span> &gt; <span th:text="#{nav.aulas}">Aulas</span></div>
        <div class="page-header">
            <h1 th:text="#{nav.aulas}">Aulas</h1>
            <div class="page-actions" sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')">
                <a th:href="@{/configuracion/aulas/nuevo}" class="btn btn-primary" th:text="#{aulas.nueva}">+ Nueva Aula</a>
            </div>
        </div>
        <div class="tabla-wrapper" th:if="${not #lists.isEmpty(aulas)}">
            <table>
                <thead><tr><th th:text="#{edfisica.colNombre}">Nombre</th><th th:text="#{aulas.colCapacidad}">Capacidad</th><th th:text="#{common.estado}">Estado</th><th th:text="#{common.acciones}">Acciones</th></tr></thead>
                <tbody>
                <tr th:each="a : ${aulas}">
                    <td data-label="Nombre" th:text="${a.nombre}">Aula</td>
                    <td data-label="Capacidad" th:text="${a.capacidad ?: '-'}">-</td>
                    <td data-label="Estado">
                        <span class="chip chip-verde" th:if="${a.activa}" th:text="#{estado.activo.f}">Activa</span>
                        <span class="chip chip-rojo" th:unless="${a.activa}" th:text="#{estado.inactivo.f}">Inactiva</span>
                    </td>
                    <td data-label="Acciones" style="display:flex;gap:6px">
                        <button type="button" class="btn btn-secondary compacto" th:if="${a.activa}"
                                th:attr="data-reservar-aula-id=${a.id},data-reservar-aula-nombre=${a.nombre}" th:text="#{aulas.reservar}">Reservar</button>
                        <a th:href="@{/configuracion/aulas/{id}/editar(id=${a.id})}" class="btn btn-icon"
                           sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')">&#9998;</a>
                        <form th:action="@{/configuracion/aulas/{id}/eliminar(id=${a.id})}" method="post"
                              th:attr="data-confirm=#{aulas.confirmEliminar}" data-confirm="¿Eliminar el aula? Esta accion no se puede deshacer."
                              sec:authorize="hasAnyRole('SUPERADMIN','DIRECTIVO','ADMINISTRATIVO')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-icon">&#128465;</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="estado-vacio" th:if="${#lists.isEmpty(aulas)}"><h3 th:text="#{aulas.vacio}">No hay aulas cargadas</h3></div>

        <div class="card" style="margin-top:16px">
            <h3 th:text="#{aulas.misReservas}">Mis Reservas</h3>
            <div class="tabla-wrapper" th:if="${not #lists.isEmpty(misReservas)}">
                <table>
                    <thead><tr><th th:text="#{dashboard.docente.colAula}">Aula</th><th th:text="#{workshops.colCurso}">Curso</th><th th:text="#{alumnos.legajo.colFecha}">Fecha</th><th th:text="#{aulas.colPeriodo}">Periodo</th><th th:text="#{aulas.colMotivo}">Motivo</th><th th:text="#{common.acciones}">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="r : ${misReservas}" th:with="periodo=${periodoPorOrden.get(r.periodoOrden)}">
                        <td data-label="Aula" th:text="${r.aula.nombre}">-</td>
                        <td data-label="Curso" th:text="${r.cursoDivision.nombreCompleto}">-</td>
                        <td data-label="Fecha" th:text="${#temporals.format(r.fecha,'dd/MM/yyyy')}">-</td>
                        <td data-label="Periodo" th:text="${periodo != null} ? ${periodo.nombre} : (#{aulas.colPeriodo} + ' ' + ${r.periodoOrden})">-</td>
                        <td data-label="Motivo" th:text="${r.motivo}">-</td>
                        <td data-label="Acciones">
                            <form th:action="@{/configuracion/aulas/reservas/{id}/cancelar(id=${r.id})}" method="post"
                                  th:attr="data-confirm=#{aulas.confirmCancelarReserva}" data-confirm="¿Cancelar esta reserva?">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-icon">&#10060;</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="estado-vacio" th:if="${#lists.isEmpty(misReservas)}"><h3 th:text="#{aulas.vacioReservas}">No tenes reservas de aulas</h3></div>
        </div>

        <div class="modal-overlay" id="modal-reservar-aula" style="display:none">
            <div class="modal-card">
                <h3 th:text="#{aulas.reservarAula}">Reservar aula</h3>
                <p class="texto-secundario" id="reservar-aula-nombre"></p>
                <form th:action="@{/configuracion/aulas/reservar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="aulaId" id="reservar-aula-id"/>
                    <div class="form-group">
                        <label th:text="#{common.cursoDivision}">Curso/Division</label>
                        <select name="cursoDivisionId" required>
                            <option value="">-</option>
                            <option th:each="cd : ${cursosDivisiones}" th:value="${cd.id}" th:text="${cd.nombreCompleto}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{alumnos.legajo.colFecha}">Fecha</label>
                        <input type="date" name="fecha" th:min="${#temporals.format(hoy,'yyyy-MM-dd')}" required/>
                    </div>
                    <div class="form-group">
                        <label th:text="#{aulas.colPeriodo}">Periodo</label>
                        <select name="periodoOrden" required>
                            <option value="">-</option>
                            <option th:each="p : ${periodos}" th:value="${p.orden}"
                                    th:text="${p.nombre} + ' (' + ${#temporals.format(p.horaInicio,'HH:mm')} + ' - ' + ${#temporals.format(p.horaFin,'HH:mm')} + ')'"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label th:text="#{aulas.paraQueLaVasAUsar}">Para que la vas a usar</label>
                        <input type="text" name="motivo" th:placeholder="#{aulas.motivoPlaceholder}" placeholder="Ej: Laboratorio de ciencias, reunion, actividad especial" maxlength="200" required/>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="btn-cancelar-reservar-aula" th:text="#{accion.cancelar}">Cancelar</button>
                        <button type="submit" class="btn btn-primary" th:text="#{aulas.reservar}">Reservar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
