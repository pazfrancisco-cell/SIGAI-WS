<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Workshop')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/configuracion/workshops}" th:text="#{nav.workshops}">Workshops</a> &gt; <span th:text="${workshopForm.id != null} ? #{accion.editar} : #{accion.nuevo}"></span></div>
        <h1 th:text="${workshopForm.id != null} ? #{catalogoWorkshops.tituloEditar} : #{catalogoWorkshops.tituloNuevo}">Workshop</h1>
        <form th:action="@{/configuracion/workshops}" th:object="${workshopForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="form-group">
                <label th:text="#{alumnos.form.nombre}">Nombre*</label>
                <input type="text" th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'error'"/>
                <div class="error-mensaje" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>
            <div class="form-group"><label th:text="#{alumnos.legajo.colDescripcion}">Descripcion</label><textarea th:field="*{descripcion}"></textarea></div>
            <div class="form-group">
                <label th:text="#{workshops.banda}">Banda de años*</label>
                <select th:field="*{banda}">
                    <option value="ANIOS_1_A_3" th:text="#{workshops.banda.1a3}">1° a 3° año</option>
                    <option value="ANIOS_4_A_6" th:text="#{workshops.banda.4a6}">4° a 6° año</option>
                </select>
            </div>
            <div class="checkbox-row"><input type="checkbox" id="activo" th:field="*{activo}"/><label for="activo" style="margin:0" th:text="#{estado.activo}">Activo</label></div>
            <div class="page-actions">
                <a th:href="@{/configuracion/workshops}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
