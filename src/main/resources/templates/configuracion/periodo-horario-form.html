<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Periodo Horario')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/configuracion/periodos-horarios}" th:text="#{nav.horarios.estructuraDia}">Estructura del Dia</a> &gt; <span th:text="${periodoHorarioForm.id != null} ? #{accion.editar} : #{accion.nuevo}"></span></div>
        <h1 th:text="${periodoHorarioForm.id != null} ? #{periodos.tituloEditar} : #{periodos.tituloNuevo}">Periodo</h1>
        <form th:action="@{/configuracion/periodos-horarios}" th:object="${periodoHorarioForm}" method="post" class="card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="form-row">
                <div class="form-group">
                    <label th:text="#{periodos.ordenRequerido}">Orden*</label>
                    <input type="number" th:field="*{orden}" th:classappend="${#fields.hasErrors('orden')} ? 'error'"/>
                    <div class="error-mensaje" th:if="${#fields.hasErrors('orden')}" th:errors="*{orden}"></div>
                </div>
                <div class="form-group">
                    <label th:text="#{alumnos.form.nombre}">Nombre*</label>
                    <input type="text" th:field="*{nombre}" th:placeholder="#{periodos.nombrePlaceholder}" placeholder="Ej: Periodo 1, Recreo, Almuerzo" th:classappend="${#fields.hasErrors('nombre')} ? 'error'"/>
                    <div class="error-mensaje" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="form-group">
                    <label th:text="#{calificaciones.tipoRequerido}">Tipo*</label>
                    <select th:field="*{tipo}">
                        <option value="CLASE" th:text="#{periodos.tipoClase}">Clase</option>
                        <option value="RECREO" th:text="#{periodos.tipoRecreo}">Recreo</option>
                        <option value="ALMUERZO" th:text="#{periodos.tipoAlmuerzo}">Almuerzo</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label th:text="#{periodos.horaInicioRequerido}">Hora de inicio*</label>
                    <input type="time" th:field="*{horaInicio}"/>
                </div>
                <div class="form-group">
                    <label th:text="#{periodos.horaFinRequerido}">Hora de fin*</label>
                    <input type="time" th:field="*{horaFin}"/>
                </div>
            </div>
            <div class="page-actions">
                <a th:href="@{/configuracion/periodos-horarios}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
