<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Editar Plantilla')}"></head>
<body>
<div th:replace="~{fragments/topbar :: topbar}"></div>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="content">
        <div class="breadcrumb"><a th:href="@{/configuracion/plantillas-email}" th:text="#{nav.plantillasEmail}">Plantillas de Email</a> &gt; <span th:text="${plantilla.descripcion}">Editar</span></div>
        <h1 th:text="${plantilla.descripcion}">Editar Plantilla</h1>
        <p class="texto-secundario"><span th:text="#{plantillasEmail.tipoInterno}">Tipo interno:</span> <code th:text="${plantilla.tipo}">TIPO</code></p>

        <form th:action="@{/configuracion/plantillas-email/{id}(id=${plantilla.id})}" method="post" class="card" style="max-width:680px">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label th:text="#{plantillasEmail.colAsunto}">Asunto</label>
                <input type="text" name="asunto" th:value="${plantilla.asunto}"/>
            </div>
            <div class="form-group">
                <label th:text="#{plantillasEmail.cuerpo}">Cuerpo (HTML)</label>
                <textarea name="cuerpo" style="min-height:200px" th:text="${plantilla.cuerpo}"></textarea>
            </div>
            <div class="checkbox-row" style="margin-bottom:16px">
                <input type="checkbox" id="habilitada" name="habilitada" value="true" th:checked="${plantilla.habilitada}"/>
                <label for="habilitada" style="margin:0" th:text="#{plantillasEmail.habilitada}">Habilitada</label>
            </div>
            <div class="page-actions">
                <a th:href="@{/configuracion/plantillas-email}" class="btn btn-secondary" th:text="#{accion.cancelar}">Cancelar</a>
                <button type="submit" class="btn btn-primary" th:text="#{accion.guardar}">Guardar</button>
            </div>
        </form>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
